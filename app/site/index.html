  const X = i => TM.l + (n > 1 ? i * dx : pw / 2), Y = v => TM.t + ph - v / ymax * ph;

  if (!pr.length) return NO_GRAB;
  const a = A('hourly'), hr = rows('hourly', {ch:STORE});
  const gd = new Set(pr.map(r => r[p.loc] + r[p.d])).size || 1, sd = new Set(hr.map(r => r[a.loc] + r[a.d])).size || 1;
  const gh = {}, sh = {};
  for (const r of pr) gh[r[p.hour]] = (gh[r[p.hour]] || 0) + r[p.orders] / gd;
  for (const r of hr) sh[r[a.hour]] = (sh[r[a.hour]] || 0) + r[a.orders] / sd;
  const hours = [...new Set([...Object.keys(gh), ...Object.keys(sh)].map(Number))].filter(x => (gh[x] || 0) + (sh[x] || 0) > 0.05).sort((x, y) => x - y);
  const gm = Math.max(...hours.map(x => gh[x] || 0)), sm = Math.max(...hours.map(x => sh[x] || 0));
  let b = '';
  for (const x of hours) b += `<tr class="${x >= 16 && x < 20 ? 'hl' : ''}"><td>${x}:00</td><td>${barCell(gh[x] || 0, gm, fmt(gh[x] || 0, 2), true)}</td><td>${barCell(sh[x] || 0, sm, fmt(sh[x] || 0, 2))}</td></tr>`;
  return '<div class="card"><b>' + t('vg_title') + '</b><div class="note">' + t('vg_note') + '</div>' + table(th([t('hour'), 'Grab', t('store')]), b) + '</div>';
}

// ---- menu-pair scripts (feed `pairs_menu`, sales_tables.build_pair_attach): main family x item,
// rate = bills with both / bills with the main, last 30 full days, in-store channels summed.
// For each selected office branch: gap vs the best OTHER office branch (both need >= 30 main bills);
// ฿ = gap x the branch's main bills x item price. Rama 9 has no peers -> not scripted.
function pairCard() {
  if (!D.cols.pairs_menu) return '';
  const p = A('pairs_menu'), all = get('pairs_menu'), fb = {}, ag = {};
  for (const r of all) {   // family bills per loc (sum over channels; same for every item row of a loc|ch|fam)
    fb[r[p.loc] + '|' + r[p.channel] + '|' + r[p.fam]] = r[p.bills_main];
    const k = r[p.loc] + '|' + r[p.fam] + '|' + r[p.item], x = ag[k] || (ag[k] = {loc:r[p.loc], fam:r[p.fam], item:r[p.item], both:0, thb:0});
    x.both += r[p.bills_both]; x.thb += (r[p.price] || 0) * r[p.bills_both];
  }
  const fam = {}; for (const [k, v] of Object.entries(fb)) { const [l, , f] = k.split('|'); fam[l + '|' + f] = (fam[l + '|' + f] || 0) + v; }
  const MIN = 30, office = D.branches.map(b => b.id).filter(id => id !== 'rama9');
  const byPair = group(Object.values(ag), x => x.fam + '|' + x.item), out = [];
  for (const id of selBranches().filter(id => office.includes(id))) {
    for (const [pk, xs] of byPair) {
      const [f, it] = pk.split('|'), nb = fam[id + '|' + f] || 0; if (nb < MIN) continue;
      const me = xs.find(x => x.loc === id), rate = me ? me.both / nb : 0;
      let best = null;
      for (const x of xs) { if (x.loc === id || !office.includes(x.loc)) continue; const n = fam[x.loc + '|' + f] || 0; if (n < MIN) continue; const r = x.both / n; if (!best || r > best.rate) best = {loc:x.loc, rate:r, price:x.thb / x.both}; }
      if (!best || best.rate <= rate) continue;
      const price = me && me.both ? me.thb / me.both : best.price;
      out.push({id, f, it, rate, best, nb, v:(best.rate - rate) * nb * price});
    }
  }
  out.sort((a, b) => b.v - a.v);
  const lines = out.slice(0, 10).map(x => `<li>${t('pm_line', esc(x.f), esc(x.it), bn(x.best.loc), pct(x.best.rate, 0), bn(x.id), pct(x.rate, 0), fmt(x.v))}</li>`).join('');
  return `<div class="card"><b>${t('t_pairs_menu')}</b><div class="note">${t('pm_note')}</div>` +
    (lines ? `<ol class="pm">${lines}</ol>` : `<div class="muted">${t('no_data')}</div>`) + '</div>';
}
// ---- dead hours, benchmarked (feed `dead_hours`, sales_tables.build_dead_hours; ruling 2026-10-08):
// off-peak hours 10, 14, 15, 16, 20 (11 excluded 2026-10-08: early lunch), weekdays, last 30 full days; per hour target = the smaller of the
// office peer (2nd-best) and own best 4 weeks that is above current. "14:00 4.2%→6.0% (own best)" list.

  return get('dead_hours').filter(r => r[d.loc] === loc && r[d.target] != null && r[d.thb_day] > 0)
    .map(r => t('dead_hr', r[d.hour], pct(r[d.occ]), pct(r[d.target]),
      r[d.peer] != null && Math.abs(r[d.peer] - r[d.target]) < 1e-9 ? t('dead_by_peer', bn(r[d.peer_loc])) : t('dead_by_own', ddmm(r[d.own_win])), fmt(r[d.thb_day]))).join(' · ') || t('dead_none');
}
// ---- dead-hour card (section 2, under occupancy). Default mode 'peer' = the benchmarked number above
// (same as the opportunity row). 40/50/60% = what-if CEILING over the selected range: persons needed =
// max(0, target - occ) x seats (1-hour rule, occ = persons opened / seats); ฿ = persons x
// ticket/head; ฿/month = ฿/day x open days scaled to 30 calendar days.
function deadCard() {
  if (!D.cols.occupancy) return '';
  const mode = S.deadT;
  const seg = '<span class="seg">' + [['peer', t('dead_peer_btn')], [0.4, '40%'], [0.5, '50%'], [0.6, '60%']]
    .map(([v, l]) => `<button data-act="deadt" data-k="${v}" class="${mode === v ? 'on' : ''}">${l}</button>`).join('') + '</span>';
  let body = '';
  if (mode === 'peer') {
    const d = A('dead_hours'), dr = get('dead_hours');
    for (const id of selBranches()) {
      if (id === 'rama9') { body += `<tr><td>${bn(id)}</td><td class="muted" colspan="5">${t('dead_r9')}</td></tr>`; continue; }
      const x = dr.filter(r => r[d.loc] === id); if (!x.length) continue;
      const ppl = sum(x, r => r[d.persons]), day = sum(x, r => r[d.thb_day]), days = x[0][d.days];
      body += `<tr><td>${bn(id)}</td><td class="muted">${deadHourList(id)}</td><td class="n">${fmt(ppl, 1)}</td><td class="n">${fmt(x[0][d.ticket])}</td><td class="n">${fmt(day)}</td><td class="n"><b>${fmt(day * days)}</b></td></tr>`;
    }
    return `<div class="card"><b>${t('t_dead_val')}</b> ${seg}<div class="note">${t('dead_note_peer')}</div>` +
      table(th([t('branch'), t('dead_hours_h'), [t('dead_ppl')], [t('dead_tkt')], [t('dead_day')], [t('dead_month_wd')]]), body) + '</div>';
  }
  const T_ = mode, ag = occAgg(), tr = A('tree'), trs = rows('tree', {ch:['dine_in']});
  const end = F.to < maxDate() ? F.to : maxDate();
  const span = Math.max(1, Math.round((new Date(end + 'T00:00:00Z') - new Date(F.from + 'T00:00:00Z')) / 864e5) + 1);
  for (const id of selBranches()) {
    const b = B[id], x = ag[id]; if (!x || !b.seats) continue;
    if (id === 'rama9') { body += `<tr><td>${bn(id)}</td><td class="muted" colspan="5">${t('dead_r9')}</td></tr>`; continue; }
    const lr = trs.filter(r => r[tr.loc] === id), tk = div(sum(lr, r => r[tr.net]), sum(lr, r => r[tr.main] + (r[tr.set] || 0)));
    let ppl = 0; const hrs = [];
    for (const hh of OCC_H) {   // 1-hour rule: occ = persons opened / seats; persons needed = (T - occ) x seats
      const c = x.h[hh]; if (!c) continue;
      const occ = c.po / (b.seats * x.days);
      if (occ >= T_) continue;
      const p = (T_ - occ) * b.seats; ppl += p; hrs.push(`<span title="${esc(t('dead_tip', pct(occ, 0), fmt(p, 0)))}">${hh}:00</span>`);
    }
    const day = ppl * (tk || 0), month = day * x.days / span * 30;
    body += `<tr><td>${bn(id)}</td><td class="muted">${hrs.join(' ') || t('dead_none')}</td><td class="n">${fmt(ppl, 0)}</td><td class="n">${fmt(tk)}</td><td class="n">${fmt(day)}</td><td class="n">${fmt(month)}</td></tr>`;
  }
  return `<div class="card"><b>${t('t_dead_val')}</b> ${seg} <span class="tag">${t('dead_ceiling')}</span><div class="note">${t('dead_note')}</div>` +
    `<div class="note"><b>${t('dead_caveat')}</b></div>` +
    table(th([t('branch'), t('dead_hours_h'), [t('dead_ppl')], [t('dead_tkt')], [t('dead_day')], [t('dead_month')]]), body) + '</div>';
}

// ---------------------------------------------------------------- filters, nav, events

  menu:renderMenu, insights:renderInsights, weekly:renderWeekly, grab:renderGrab};
const current = () => { const h = (location.hash || '#tree').slice(1); return RENDER[h] ? h : 'tree'; };

function lastDay() { return D.today_partial ? maxDate() : D.data_through; }
let _maxDate = null;

function minDate() { const t = A('tree'); return D.tree.reduce((m, r) => r[t.d] < m ? r[t.d] : m, D.data_through); }
function setPreset(p) {

  if (p === '7' || p === '30' || p === '90') { F.to = end; F.from = addDays(end, -(+p - 1)); }

  if (F.from < minDate()) F.from = minDate();
}
function drawFilters() {

  const segs = (act, list, cur) => '<span class="seg">' + list.map(([k, l]) => `<button data-act="${act}" data-k="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('') + '</span>';
  document.getElementById('filters').innerHTML =

    D.branches.map(b => `<label><input type="checkbox" data-act="br" data-k="${esc(b.id)}"${F.branches.has(b.id) ? ' checked' : ''}> ${bn(b.id)}</label>`).join('') + '</div>' +
    '<div class="grp"><b>' + t('f_channel') + '</b> ' + segs('chan', [['store', t('store')], ['grab', 'Grab'], ['both', t('f_both')]], F.channel) + '</div>' +
    '<div class="grp rng"><b>' + t('f_range') + '</b> ' + segs('preset', presets, F.preset) +

    (CAL.open ? '<div id="cal"></div>' : '') + '</div>' +
    '<div class="grp"><b>' + t('f_day') + '</b> ' + segs('dtype', [['all', t('every_day')], ['weekday', t('weekday')], ['weekend', t('weekend')], ['holiday', t('holiday')]], F.daytype) + '</div>';
  if (CAL.open) calDraw();
}
// ---- custom-range calendar popover: two months (one on narrow screens), click start then end
const CAL = {open:false, a:null, hov:null, m:''};   // m = 'YYYY-MM' of the RIGHT month
function addMonths(ym, n) { const d = new Date(ym + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); }
function calOpen() { CAL.open = true; CAL.a = CAL.hov = null; CAL.m = lastDay().slice(0, 7); drawFilters(); }
function calClose() { if (!CAL.open) return; CAL.open = false; CAL.a = CAL.hov = null; const el = document.getElementById('cal'); if (el) el.remove(); }
function calMonth(ym) {
  const title = new Intl.DateTimeFormat(LANG === 'th' ? 'th-TH-u-ca-buddhist' : 'en-US', {month:'long', year:'numeric', timeZone:'UTC'}).format(new Date(ym + '-01T00:00:00Z'));
  const lead = (new Date(ym + '-01T00:00:00Z').getUTCDay() + 6) % 7, n = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
  const lo = minDate(), hi = lastDay(), today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  let g = t('cal_wd').split(' ').map(w => `<div class="w">${w}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let i = 1; i <= n; i++) {
    const d = ym + '-' + String(i).padStart(2, '0'), w = (lead + i - 1) % 7;
    const cls = 'd' + (w >= 5 ? ' we' : '') + (HOL.has(d) ? ' hol' : '') + (d === today ? ' td' : '');
    g += `<button class="${cls}" data-act="cald" data-k="${d}"${d < lo || d > hi ? ' disabled' : ''}>${i}</button>`;
  }
  return `<div><div class="mh">${title}</div><div class="g">${g}</div></div>`;
}
function calDraw() {
  const el = document.getElementById('cal'); if (!el) return;
  const L = addMonths(CAL.m, -1), lo = minDate().slice(0, 7), hi = lastDay().slice(0, 7);
  el.innerHTML = '<div class="ms">' + calMonth(L) + calMonth(CAL.m) + '</div>' +
    '<div class="ft"><span id="calSel"></span><button data-act="calc">' + t('cal_clear') + '</button><button data-act="calx">' + t('cal_close') + '</button></div>';
  const pv = (m, x) => `<button class="${x}" data-act="calm" data-k="-1" title="${t('cal_prev')}"${m <= lo ? ' disabled' : ''}>‹</button>`;
  const hs = el.querySelectorAll('.mh');   // left: ‹ ; right: (‹ when narrow) ›

function calPaint() {

document.addEventListener('pointerover', e => {

document.addEventListener('click', e => {   // capture: runs before any redraw detaches the target
  if (CAL.open && !e.target.closest('#cal, [data-act="calo"], [data-act="preset"][data-k="custom"]')) calClose();

document.addEventListener('keydown', e => { if (e.key === 'Escape') calClose(); });
function changed() { drawFilters(); render(); }
const ACT = {

  br: k => { F.branches.has(k) ? F.branches.delete(k) : F.branches.add(k); changed(); },

function fallbackCopy(t, ok) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); }
const CHANGE = {

// ---------------------------------------------------------------- load: live edge -> fallback baked copy
let LOADFAIL = false;
function banner() {
  const el = document.getElementById('banner');
  if (!D) { el.innerHTML = `<span class="pill${LOADFAIL ? ' dead' : ''}">${t(LOADFAIL ? 'load_fail' : 'loading')}</span>` + langToggle(); return; }
  const ageMin = (Date.now() + 7 * 3600e3 - Date.parse(D.generated_at.replace(' ', 'T') + ':00Z')) / 60000;
  const stale = ageMin > 90, red = FALLBACK || stale;
  const extra = FALLBACK ? t('fb_copy') : stale ? t('stale', ageMin > 120 ? t('hrs', Math.round(ageMin / 60)) : t('mins', Math.round(ageMin))) : '';
  el.innerHTML =
    `<span class="pill ${red ? 'dead' : 'live'}" id="fresh" title="${FALLBACK ? t('fb_title') : t('live_title')}">${t('data_at', esc(D.generated_at), extra)}</span>` +
    `<span class="pill">${t('through')} <b>${esc(D.data_through)}</b></span>` +
    (D.today_partial ? '<span class="muted">' + t('partial') + '</span>' : '') +
    `<span class="muted">Grab: ${esc(((D.grab && D.grab.months) || []).join(', ')) || '–'}</span>` + langToggle();
}
async function fetchLive() {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(EDGE_URL, {headers:{'x-dash-token':TOKEN}, signal:ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
async function load() {

}
applyLang(); banner();
load().catch(e => { console.error(e); D = null; LOADFAIL = true; banner(); });
